parallel-jobs = 1
compression-level = 9
remove-rv-integrations-checks = true
enable-magisk-update = true

rv-brand = ""

cli-source = "j-hc/revanced-cli"
cli-version = "latest"

patches-source = "revanced/revanced-patches"
patches-version = "dev"

#========== YouTube ==========#

[YouTube-Premium]
enabled = true
app-name = "YouTube Premium"
# rv-brand = ""
build-mode = "apk"
version = "auto"
arch = "both"
riplib = false
# module-prop-name = "h1toru-rvm-ytp"

patches-source = "anddea/revanced-patches"
patches-version = "dev"

patcher-args = """\
  --rip-lib x86_64 --rip-lib x86 \
  -e 'Change version code' \
  -e 'GmsCore support' -OpackageNameYouTube='h1toru.rvm.ytp' \
  -e 'Custom branding name for YouTube' -OappName='YouTube Premium' \
  -d 'Custom branding icon for YouTube' \
  -d 'Custom header for YouTube' \
  -e 'Settings for YouTube' -OrvxSettingsLabel='Premium options' -OinsertPosition='About' \
  -e 'Theme' -OdarkThemeBackgroundColor='#000000' -OlightThemeBackgroundColor='#FFFFFF' \
  \
  -e 'Return YouTube Dislike' \
  -e 'Return YouTube Username' \
  -e 'SponsorBlock' \
  -d 'Alternative thumbnails' \
  -d 'Enable debug logging' \
  -d 'Translations for YouTube' \
  -d 'Set Transcript Cookies' \
  -d 'Disable layout updates' \
  -d 'Spoof app version' \
  -d 'Enable gradient loading screen' \
  -d 'Force player buttons background' \
  -d 'Hide Shorts dimming' \
  -d 'Custom double tap length' \
  -d 'Hide shortcuts' \
  """

# apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
# uptodown-dlurl = "https://youtube.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/core-apks/apks/com.google.android.youtube"

#========== YouTube Music ==========#

[YTMusic-Premium]
enabled = true
app-name = "YTMusic Premium"
# rv-brand = ""
build-mode = "apk"
version = "auto"
arch = "both"
riplib = false
# module-prop-name = "h1toru-rvm-ytmp"

patches-source = "anddea/revanced-patches"
patches-version = "dev"

patcher-args = """\
  --rip-lib x86_64 --rip-lib x86 \
  -e 'Change version code' \
  -e 'GmsCore support' -OpackageNameYouTubeMusic='h1toru.ytmp' \
  -e 'Custom branding name for YouTube Music' -OappNameLauncher='YTMusic Premium' -OappNameNotification='YTMusic Premium' \
  -d 'Custom branding icon for YouTube Music' \
  -d 'Custom header for YouTube Music' \
  -e 'Settings for YouTube Music' -OrvxSettingsLabel='Premium options' -OinsertPosition='About YouTube Music' \
  -e 'Dark theme' -OdarkThemeBackgroundColor='#000000' \
  \
  -e 'Return YouTube Dislike' \
  -e 'Return YouTube Username' \
  -e 'SponsorBlock' \
  -d 'Enable debug logging' \
  -d 'Translations for YouTube Music' \
  -d 'Spoof app version' \
  -e 'Disable music video in album' \
  """

apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
# uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"

#========== Spotify ==========#

[Spotify-arm64]
enabled = true
app-name = "Spotify"
# rv-brand = ""
version = "auto"
arch = "arm64-v8a"
riplib = false

patches-source = "anddea/revanced-patches"
patches-version = "dev"

patcher-args = """\
  --rip-lib x86_64 --rip-lib x86 --rip-lib armeabi-v7a \
  -d 'Custom theme' \
  -d 'Lyrics search' \
  """
# -e 'Custom theme' -ObackgroundColor='#FF000000' -OenableBackgroundColorSecondary=true -ObackgroundColorSecondary='#FF121212' \

uptodown-dlurl = "https://spotify.en.uptodown.com/android"
# archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.spotify.music"

[Spotify-arm]
enabled = false
app-name = "Spotify"
# rv-brand = ""
version = "auto"
arch = "armeabi-v7a"
riplib = false

patches-source = "anddea/revanced-patches"
patches-version = "dev"

patcher-args = """\
  --rip-lib x86_64 --rip-lib x86 --rip-lib arm64-v8a \
  -e 'Custom theme' \
  -d 'Lyrics search' \
  """

uptodown-dlurl = "https://spotify.en.uptodown.com/android"
# archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.spotify.music"

#========== Instagram ==========#

[MyInsta-arm64]
enabled = false
app-name = "MyInsta-v26.0"
# rv-brand = ""
version = "364.0.0.35.86"
arch = "arm64-v8a"
riplib = false

patcher-args = """\
  --rip-lib x86_64 --rip-lib x86 --rip-lib armeabi-v7a \
  -e 'Disable signature check' \
  -e 'Sanitize sharing links' \
  -e 'Enable developer menu' \
  -e 'Hide ads' \
  -e 'Limit feed to followed profiles' \
  """

archive-dlurl = "https://archive.org/download/core-apks/com.instagram.android-MyInsta"

